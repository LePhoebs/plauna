{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl flex flex-col gap-5">
  <nav class="text-xs text-base-content/60" aria-label="{% t category.breadcrumb %}">
    <a class="link link-hover" href="/admin">{% t nav.system %}</a> / {% t system.preferences %}
  </nav>
  <header class="flex flex-col gap-1">
    <h1 class="text-2xl font-bold">{% t system.preferences %}</h1>
    <p class="text-base-content/70 max-w-prose">{% t general.intro %}</p>
  </header>

  <form action="/admin/preferences" method="POST" class="card bg-base-100 border border-base-300">
    <div class="card-body gap-4">
      <input type="hidden" name="redirect-url" value="/admin/preferences">
      <label class="flex flex-col gap-1" for="time-zone">
        <span class="font-semibold">{% t general.time-zone %}</span>
        <input id="time-zone" class="input w-full sm:w-72" name="time-zone" value="{{time-zone}}" placeholder="Europe/Berlin" required>
        <span class="text-xs text-base-content/70">{% t general.time-zone-help %}</span>
      </label>
      <label class="flex flex-col gap-1" for="category-folder-scan-interval">
        <span class="font-semibold">{% t general.folder-scan %}</span>
        <input id="category-folder-scan-interval" class="input w-full sm:w-40" name="category-folder-scan-interval" type="number" min="0" value="{{category-folder-scan-interval}}">
        <span class="text-xs text-base-content/70">{% t general.folder-scan-help %}</span>
      </label>
      <label class="flex flex-col gap-1" for="client-health-check-interval">
        <span class="font-semibold">{% t general.health-check %}</span>
        <input id="client-health-check-interval" class="input w-full sm:w-40" name="client-health-check-interval" value="{{client-health-check-interval}}">
        <span class="text-xs text-base-content/70">{% t general.health-check-help %}</span>
      </label>
      <label class="flex flex-col gap-1" for="log-level">
        <span class="font-semibold">{% t general.log-level %}</span>
        <select id="log-level" class="select w-full sm:w-40" name="log-level">
          {% for option in log-level-options %}
          <option value="{{option.key}}" {% if option.key = log-level %}selected="true"{% endif %}>{{option.name}}</option>
          {% endfor %}
        </select>
      </label>
      <div><button class="btn btn-primary" type="submit">{% t email.save %}</button></div>
    </div>
  </form>
  <p class="text-xs text-base-content/70">{% t general.model-moved %} <a class="link" href="/model">{% t nav.model %}</a></p>
</div>
{% endblock %}
