{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl flex flex-col gap-5">
  <nav class="text-xs text-base-content/60" aria-label="{% t category.breadcrumb %}">
    <a class="link link-hover" href="/admin/connections">{% t nav.accounts %}</a> / {% t accounts.new %}
  </nav>
  <h1 class="text-2xl font-bold">{% t accounts.new %}</h1>

  <section class="card bg-base-100 border border-base-300 max-w-2xl">
    <form id="create" class="card-body gap-3" action="/admin/connections" method="POST">
      <input name="redirect-url" type="hidden" value="/admin/connections">
      <label class="flex flex-col gap-1" for="auth-select"><span class="text-xs text-base-content/70">{% t account.auth %}</span>
        <select id="auth-select" class="select select-sm w-full" name="auth-type">
          <option value="basic" {% if auth-type = "basic" %}selected{% endif %}>{% t account.auth-basic %}</option>
          <option value="oauth2" {% if auth-type = "oauth2" %}selected{% endif %}>OAuth 2</option>
        </select></label>
      <label class="flex flex-col gap-1 oauth-related" for="auth-provider"><span class="text-xs text-base-content/70">{% t account.provider %}</span>
        <select id="auth-provider" class="select select-sm w-full" name="auth-provider">
          <option value="" disabled {% if auth-provider = null %}selected{% endif %}>{% t account.choose %}</option>
          {% for provider in auth-providers %}
          <option value="{{provider.id}}" {% if auth-provider = provider.id %}selected{% endif %}>{{provider.name}}</option>
          {% endfor %}
        </select></label>
      <div class="grid gap-3 sm:grid-cols-2">
        <label class="flex flex-col gap-1" for="host"><span class="text-xs text-base-content/70">{% t account.host %}</span>
          <input id="host" class="input input-sm w-full" name="host" value="{{host}}" placeholder="imap.example.com"></label>
        <label class="flex flex-col gap-1" for="user"><span class="text-xs text-base-content/70">{% t account.user %}</span>
          <input id="user" class="input input-sm w-full" name="user" value="{{user}}"></label>
      </div>
      <label class="flex flex-col gap-1" for="secret"><span class="text-xs text-base-content/70">{% t account.secret %}</span>
        <input id="secret" class="input input-sm w-full" name="secret" type="password" value="" autocomplete="new-password"></label>
      <label class="flex flex-col gap-1" for="folder"><span class="text-xs text-base-content/70">{% t account.folder %}</span>
        <input id="folder" class="input input-sm w-full" name="folder" value="{{folder}}" placeholder="INBOX"></label>
      <div class="grid gap-3 sm:grid-cols-2">
        <label class="flex flex-col gap-1" for="security"><span class="text-xs text-base-content/70">{% t account.security %}</span>
          <select id="security" class="select select-sm w-full" name="security">
            <option value="ssl" selected>SSL</option>
            <option value="starttls">STARTTLS</option>
            <option value="plain">PLAIN</option>
          </select></label>
        <label class="flex flex-col gap-1" for="port"><span class="text-xs text-base-content/70">{% t account.port %}</span>
          <input id="port" class="input input-sm w-full" name="port" value="{{port}}" placeholder="{% t account.port-default %}"></label>
      </div>
      <label class="flex items-center gap-2" for="check-ssl-certs">
        <input id="check-ssl-certs" class="checkbox checkbox-sm" name="check-ssl-certs" type="checkbox" value="true" checked>
        <span>{% t account.check-certs %}</span></label>
      <label class="flex items-center gap-2" for="debug">
        <input id="debug" class="checkbox checkbox-sm" name="debug" type="checkbox" value="true" {% if debug %} checked="true"{% endif %}>
        <span>{% t account.debug %}</span></label>
      <div><button form="create" class="btn btn-primary btn-sm" type="submit">{% t accounts.create %}</button></div>
    </form>
  </section>

  <section class="oauth-related card bg-base-100 border border-base-300">
    <div class="card-body gap-3">
      {% include "admin-provider.html" %}
    </div>
  </section>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const select = document.getElementById('auth-select');
        const oauthGroup = Array.from(document.querySelectorAll('.oauth-related'));
        const oauthInputs = Array.from(oauthGroup.flatMap(el => Array.from(el.querySelectorAll('input, select, button'))));
        
        function updateOauthFields() {
            const enable = select.value === 'oauth2';
            oauthGroup.forEach(el => el.style.display = enable ? '' : 'none');
            oauthInputs.forEach(el => el.disabled = !enable);
        }
        
        updateOauthFields();
        select.addEventListener('change', updateOauthFields);
    });
</script>

{% endblock %}
