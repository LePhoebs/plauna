{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl flex flex-col gap-5">
  <nav class="text-xs text-base-content/60" aria-label="{% t category.breadcrumb %}">
    <a class="link link-hover" href="/admin">{% t nav.system %}</a> / {% t system.login %}
  </nav>
  <h1 class="text-2xl font-bold">{% t system.login %}</h1>

  <form action="/admin/login-name" method="POST" class="card bg-base-100 border border-base-300">
    <div class="card-body gap-3">
      <input type="hidden" name="redirect-url" value="/admin">
      <h2 class="card-title text-base">{% t login.name %}</h2>
      <label class="flex flex-col gap-1" for="login-name">
        <span class="text-xs text-base-content/70">{% t login.name %}</span>
        <input id="login-name" class="input w-full sm:w-80" name="login-name" type="text" value="{{login-name}}" autocomplete="username" maxlength="128" required>
        <span class="text-xs text-base-content/70">{% t login.name-help %}</span>
      </label>
      <label class="flex flex-col gap-1" for="login-name-current-password">
        <span class="text-xs text-base-content/70">{% t login.current-password %}</span>
        <input id="login-name-current-password" class="input w-full sm:w-80" name="current-password" type="password" autocomplete="current-password" required>
      </label>
      <div><button class="btn btn-primary btn-sm" type="submit">{% t login.save-name %}</button></div>
    </div>
  </form>

  <form action="/admin/password" method="POST" class="card bg-base-100 border border-base-300">
    <div class="card-body gap-3">
      <input type="hidden" name="redirect-url" value="/admin">
      <h2 class="card-title text-base">{% t login.change-password %}</h2>
      {% if env-managed %}
      <div role="alert" class="alert alert-warning alert-soft">
        <span>{% t login.env-managed %}</span>
      </div>
      {% endif %}
      <label class="flex flex-col gap-1" for="current-password">
        <span class="text-xs text-base-content/70">{% t login.current-password %}</span>
        <input id="current-password" class="input w-full sm:w-80" name="current-password" type="password" autocomplete="current-password" required>
      </label>
      <label class="flex flex-col gap-1" for="new-password">
        <span class="text-xs text-base-content/70">{% t login.new-password %}</span>
        <input id="new-password" class="input w-full sm:w-80" name="new-password" type="password" autocomplete="new-password" required>
      </label>
      <label class="flex flex-col gap-1" for="confirm-password">
        <span class="text-xs text-base-content/70">{% t login.confirm-password %}</span>
        <input id="confirm-password" class="input w-full sm:w-80" name="confirm-password" type="password" autocomplete="new-password" required>
      </label>
      <div><button class="btn btn-primary btn-sm" type="submit">{% t login.change-password %}</button></div>
    </div>
  </form>
</div>
{% endblock %}
